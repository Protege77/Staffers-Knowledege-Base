site_name: The Field Notes
site_description: GIS & Data Science Community Knowledge Base
site_url: https://protege77.github.io/Staffers-Knowledege-Base/

theme:
  name: material
  custom_dir: overrides
  favicon: assets/favicon.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Lato
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tooltips

plugins:
  - search
  - tags:
      tags_file: tags.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Protege77/Staffers-Knowledege-Base

nav:
  - Home: index.md
  - Articles: articles/index.md
  - Tags: tags.md
  - Submit: submit.md
