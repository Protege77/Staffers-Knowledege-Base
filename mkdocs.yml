site_name: The Field Notes
site_description: GIS & Data Science Community Knowledge Base
site_url: https://protege77.github.io/Staffers-Knowledege-Base/

theme:
  name: material
  favicon: assets/favicon.png

  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Lato
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - search.highlight
    - search.suggest
    - content.tooltips

plugins:
  - search
  - tags:
      tags_file: tags.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/extra.css

extra_javascript:
  - https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Protege77/Staffers-Knowledege-Base

nav:
  - Home: index.md
  - Articles:
    - articles/index.md
    - articles/2026-05-27-the-power-of-spatial-analysis.md
    - articles/2026-05-27-military-applications-of-gis.md
    - articles/2026-05-27-ukraine-seeks-god-mode-with-new-control-app-for-drone-war.md
    - articles/2026-05-27-targeting-turbineone-frontline-perception-system.md
    - articles/2026-05-27-america-downs-cheap-drones-with-million-dollar-missiles-a-fi.md
    - articles/2026-05-27-ai-got-the-blame-for-the-iran-school-bombing-the-truth-is-fa.md
    - articles/2026-05-27-hormuz-is-not-the-only-weak-spot-for-global-trade.md
    - articles/2026-05-27-memory-chip-price-surge-hits-computer-retailers-as-customers.md
    - articles/2026-05-27-defence-experts-warn-of-fitness-tracker-risks-in-singapore-m.md
    - articles/2026-05-27-refreshed-ns-medical-classification-system-to-take-effect-fr.md
    - articles/2026-05-27-singapore-must-continue-to-pay-particular-attention-to-defen.md
